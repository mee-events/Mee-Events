services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: ${MEE_DBINT_DATABASE:?MEE_DBINT_DATABASE is required}
      POSTGRES_USER: ${MEE_DBINT_USER:?MEE_DBINT_USER is required}
      POSTGRES_PASSWORD: ${MEE_DBINT_PASSWORD:?MEE_DBINT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MEE_DBINT_PORT:?MEE_DBINT_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      com.mee-events.database-integration: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MEE_DBINT_USER} -d ${MEE_DBINT_DATABASE}",
        ]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
