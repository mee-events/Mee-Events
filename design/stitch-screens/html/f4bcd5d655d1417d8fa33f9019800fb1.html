                        "tertiary-fixed-dim": "#c8c6c2",
                        "primary-container": "#4a0e0e",
                        "outline-variant": "#dac1bf",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "on-secondary-container": "#785a1a",
                        "secondary-fixed-dim": "#e9c176",
                        "secondary-container": "#fed488",
                        "on-error-container": "#93000a"
                    },
                    borderRadius: {

                    spacing: {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Input Styles */
        .form-input, .form-textarea, .form-select {
            border: 1px solid #E5DED4;
            border-radius: 8px;
            background-color: #FFFFFF;

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #4a0e0e;
            box-shadow: 0 0 0 1px #4a0e0e;
            outline: none;
        }
        
        /* Checkbox/Toggle Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4a0e0e;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4a0e0e;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-surface antialiased flex flex-col items-center">
<!-- Header / Navigation (Suppressed based on Semantic Shell Mandate for Transactional/Linear task) -->
<header class="w-full bg-background border-b border-outline-variant/30 px-gutter py-sm flex items-center justify-between sticky top-0 z-10 hidden md:flex">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full p-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-primary">Mee Events</h1>
</div>
<div class="font-button text-button text-on-surface-variant">
             Secure Checkout
         </div>
</header>
<!-- Mobile Header -->
<header class="w-full bg-background px-4 py-4 flex items-center gap-3 sticky top-0 z-10 md:hidden border-b border-outline-variant/30">
<button aria-label="Go back" class="text-on-surface-variant flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h2 text-[20px] text-primary font-semibold">Add New Address</h1>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-[800px] mx-auto px-4 md:px-gutter py-lg md:py-xl flex-grow">
<!-- Desktop Title -->
<div class="hidden md:block mb-10">
<h1 class="font-display-hero text-display-hero text-primary mb-2">Add New Address</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide your delivery details for future events.</p>
</div>
<!-- Form Container (Card on Desktop) -->
<div class="bg-surface-container-lowest md:border md:border-[#E5DED4] md:rounded-[14px] md:p-8 md:shadow-sm">
<form class="flex flex-col gap-6" id="addressForm">
<!-- Address Label -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Address Label</label>
<div class="flex gap-3">
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-button text-button hover:bg-surface-container-low focus:border-primary focus:bg-surface-container-low transition-colors active-label" type="button">
<span class="material-symbols-outlined text-[18px]">home</span>
                            Home
                        </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-button text-button hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">work</span>
                            Work
                        </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-button text-button hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">location_on</span>
                            Other
                        </button>
</div>
</div>
<div class="h-[1px] w-full bg-outline-variant/30 my-2"></div>
<!-- Contact Info Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Recipient Name -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="recipientName">Recipient Name</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="recipientName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="mobileNumber">Mobile Number</label>
<div class="relative flex">
<span class="inline-flex items-center px-3 border border-r-0 border-[#E5DED4] bg-surface-container-low text-on-surface-variant font-body-md text-body-md rounded-l-[8px]">+91</span>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface rounded-l-none" id="mobileNumber" pattern="[0-9]{10}" placeholder="98765 43210" required="" type="tel"/>
</div>
</div>
</div>
<!-- Address Grid -->
<div class="grid grid-cols-1 gap-6">
<!-- Building / House -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="building">Building / House / Flat No.</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="building" placeholder="Apt 4B, The Grand Residence" required="" type="text"/>
</div>
<!-- Street / Locality -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="street">Street / Locality</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="street" placeholder="Jubilee Hills, Road No. 36" required="" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Landmark -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="landmark">Landmark (Optional)</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="landmark" placeholder="Near Apollo Hospital" type="text"/>
</div>
<!-- PIN Code -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="pincode">PIN Code</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="pincode" pattern="[0-9]{6}" placeholder="500033" required="" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- City -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="city">City</label>
<input class="form-input w-full px-4 py-3 font-body-md text-body-md text-on-surface" id="city" placeholder="Hyderabad" required="" type="text"/>
</div>
<!-- State -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="state">State</label>
<select class="form-select w-full px-4 py-3 font-body-md text-body-md text-on-surface appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23544341%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:1.2em_1.2em]" id="state" required="">
<option disabled="" selected="" value="">Select State</option>
<option value="TG">Telangana</option>
<option value="AP">Andhra Pradesh</option>
<option value="KA">Karnataka</option>
<option value="MH">Maharashtra</option>
<option value="TN">Tamil Nadu</option>
</select>
</div>
</div>
<!-- Delivery Notes -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="notes">Delivery Notes (Optional)</label>
<textarea class="form-textarea w-full px-4 py-3 font-body-md text-body-md text-on-surface resize-none" id="notes" placeholder="e.g., Leave at the security desk..." rows="3"></textarea>
</div>
<div class="h-[1px] w-full bg-outline-variant/30 my-2"></div>
<!-- Set as Default Toggle -->
<div class="flex items-center justify-between py-2">
<div class="flex flex-col">
<span class="font-h2 text-[18px] text-on-surface font-medium">Set as default address</span>
<span class="font-body-md text-[14px] text-on-surface-variant">Use this for future deliveries</span>
</div>
<label class="flex items-center cursor-pointer" for="toggle">
<div class="relative">
<input class="sr-only" id="toggle" type="checkbox"/>
<div class="block bg-surface-container-high w-14 h-8 rounded-full border border-outline-variant transition-colors duration-300" id="toggle-bg"></div>
<div class="dot absolute left-1 top-1 bg-surface-container-lowest w-6 h-6 rounded-full transition transform duration-300 shadow-sm border border-[#E5DED4]" id="toggle-dot"></div>
</div>
</label>
</div>
<!-- Action Button -->
<div class="mt-4 pt-4 md:pt-0 sticky bottom-4 md:static z-20">
<button class="w-full bg-surface-container-highest text-on-surface-variant font-button text-button py-4 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2 cursor-not-allowed opacity-70" disabled="" id="submitBtn" type="submit">
<span>Save address</span>
</button>
</div>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('addressForm');
            const submitBtn = document.getElementById('submitBtn');
            const requiredInputs = form.querySelectorAll('input[required], select[required]');
            
            // Toggle switch logic
            const toggle = document.getElementById('toggle');
            const toggleBg = document.getElementById('toggle-bg');
            const toggleDot = document.getElementById('toggle-dot');
            
            toggle.addEventListener('change', function() {
                if(this.checked) {
                    toggleBg.classList.remove('bg-surface-container-high');
                    toggleBg.classList.add('bg-primary-container');
                    toggleDot.classList.add('translate-x-6');
                } else {
                    toggleBg.classList.add('bg-surface-container-high');
                    toggleBg.classList.remove('bg-primary-container');
                    toggleDot.classList.remove('translate-x-6');
                }
            });

            // Form validation logic
            function checkFormValidity() {
                let isValid = true;
                requiredInputs.forEach(input => {
                    if (!input.value.trim() || !input.checkValidity()) {
                        isValid = false;
                    }
                });

                if (isValid) {
                    submitBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                    submitBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-[0px_10px_30px_rgba(74,14,14,0.05)]', 'hover:opacity-90');
                    submitBtn.disabled = false;
                } else {
                    submitBtn.classList.add('bg-surface-container-highest', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                    submitBtn.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-[0px_10px_30px_rgba(74,14,14,0.05)]', 'hover:opacity-90');
                    submitBtn.disabled = true;
                }
            }

            requiredInputs.forEach(input => {
                input.addEventListener('input', checkFormValidity);
                input.addEventListener('change', checkFormValidity);
            });
            
            // Label selection logic
            const labelBtns = form.querySelectorAll('button[type="button"]');
            labelBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    labelBtns.forEach(b => {
                        b.classList.remove('border-primary', 'bg-surface-container-low', 'active-label');
                        b.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                    });
                    this.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    this.classList.add('border-primary', 'bg-surface-container-low', 'active-label');
                });
            });
            
            // Initialize button state
            // Pre-select 'Home' visually
            const homeBtn = labelBtns[0];
            homeBtn.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
            homeBtn.classList.add('border-primary', 'bg-surface-container-low');
        });
    </script>
</body></html>
