<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mee Events - Payment Processing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=EB+Garamond:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1c1b1b",
                        "outline": "#877270",
                        "primary": "#2a0002",
                        "background": "#fcf9f8",
                        "surface-bright": "#fcf9f8",
                        "tertiary-fixed": "#e4e2dd",
                        "on-secondary-container": "#785a1a",
                        "on-primary-container": "#cc726d",
                        "surface-container": "#f0eded",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#261900",
                        "on-secondary-fixed-variant": "#5d4201",
                        "secondary-container": "#fed488",
                        "on-primary-fixed-variant": "#77302d",
                        "inverse-surface": "#313030",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "secondary-fixed": "#ffdea5",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#eae7e7",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#775a19",
                        "tertiary": "#0f100d",
                        "primary-fixed": "#ffdad7",
                        "on-surface-variant": "#544341",
                        "on-tertiary-container": "#8c8c88",
                        "surface-container-low": "#f6f3f2",
                        "primary-container": "#4a0e0e",
                        "outline-variant": "#dac1bf",
                        "tertiary-container": "#242522",
                        "on-tertiary-fixed-variant": "#474744",
                        "on-tertiary-fixed": "#1b1c19",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#ffb3ad",
                        "surface": "#fcf9f8",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed-dim": "#ffb3ad",
                        "on-primary": "#ffffff",
                        "surface-tint": "#954742",
                        "on-surface": "#1c1b1b",
                        "secondary-fixed-dim": "#e9c176",
                        "on-primary-fixed": "#3d0506",
                        "tertiary-fixed-dim": "#c8c6c2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "48px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "sm": "12px",
                        "xs": "4px",
                        "xl": "80px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "h1": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "display-hero-mobile": ["EB Garamond"],
                        "button": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "display-hero": ["EB Garamond"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-hero-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "button": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-hero": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .pulse-ring {
            animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }
        .spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-full flex flex-col items-center justify-center antialiased">
<!-- Main Container -->
<main class="w-full max-w-container-max mx-auto px-gutter flex flex-col items-center justify-center flex-1">
<!-- Processing Card -->
<div class="bg-surface-container-lowest rounded-[14px] border border-[#E5DED4] p-lg md:p-xl flex flex-col items-center max-w-md w-full shadow-[0px_10px_30px_rgba(74,14,14,0.05)] text-center">
<!-- Animation Container -->
<div class="relative w-32 h-32 mb-lg flex items-center justify-center">
<!-- Decorative Outer Ring (Static) -->
<div class="absolute inset-0 rounded-full border border-surface-variant"></div>
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary-container pulse-ring"></div>
<div class="absolute inset-2 rounded-full border border-secondary pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Inner Spinner -->
<div class="absolute inset-4 rounded-full border-t-2 border-primary spin-slow"></div>
<!-- Center Icon -->
<div class="bg-surface-container-low rounded-full w-16 h-16 flex items-center justify-center z-10">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<!-- Status & Amount -->
<h1 class="font-display-hero-mobile md:font-display-hero text-display-hero-mobile md:text-display-hero text-primary tracking-tight mb-sm">
                Confirming your payment
            </h1>
<p class="font-h2 text-h2 text-on-surface mb-md">
                ₹3,54,000
            </p>
<div class="h-[1px] w-full bg-[#E5DED4] my-md"></div>
<!-- Details -->
<div class="w-full text-center flex flex-col gap-sm mb-lg">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Payment Reference</p>
<p class="font-body-md text-body-md font-medium font-mono text-on-surface tracking-wider">MEE-EVNT-9824-TX</p>
</div>
<!-- Warning Message -->
<div class="bg-surface-container-low rounded-lg p-md flex items-start gap-sm w-full text-left border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant shrink-0 mt-[2px]" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Please keep this screen open while we confirm the payment. Do not press back or refresh the page.
                </p>
</div>
</div>
</main>
</body></html>
