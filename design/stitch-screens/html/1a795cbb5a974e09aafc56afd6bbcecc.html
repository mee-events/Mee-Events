<style>
        .bottom-sheet-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .bottom-sheet-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out;
        }
        .backdrop-enter {
            opacity: 0;
        }
        .backdrop-enter-active {
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased overflow-hidden flex items-end justify-center min-h-screen">
<!-- Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-40 backdrop-enter-active"></div>
<!-- Bottom Sheet -->
<div class="relative w-full max-w-lg bg-surface rounded-t-[24px] shadow-[0px_-10px_40px_rgba(74,14,14,0.08)] z-50 bottom-sheet-enter-active flex flex-col max-h-[795px]">
<!-- Drag Handle / Header Area -->
<div class="pt-sm pb-md px-md flex flex-col items-center sticky top-0 bg-surface rounded-t-[24px] z-10">
<div class="w-12 h-1 bg-surface-variant rounded-full mb-md"></div>
<div class="flex items-center justify-between w-full">
<h2 class="font-display-hero-mobile text-display-hero-mobile text-on-surface">Switch role</h2>
<button aria-label="Close" class="p-xs rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Role Options List -->
<div class="px-md pb-md overflow-y-auto flex-1 flex flex-col gap-base">
<!-- Customer (Active) -->
<button aria-current="true" class="w-full min-h-[64px] rounded-xl border border-primary-container bg-surface-container-low p-sm flex items-center gap-md text-left group hover:bg-surface-container transition-colors relative overflow-hidden">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-button text-button text-primary-container mb-1">Customer</p>
<p class="font-label-caps text-label-caps text-on-surface-variant truncate normal-case tracking-normal">Plan your events</p>
</div>
<div class="flex-shrink-0 text-primary-container">
<span aria-hidden="true" class="material-symbols-outlined">check_circle</span>
</div>
<!-- Active Indicator Border -->
<div aria-hidden="true" class="absolute inset-0 border-2 border-primary-container rounded-xl pointer-events-none"></div>
</button>
<!-- Vendor (Approved) -->
<button class="w-full min-h-[64px] rounded-xl border border-surface-variant bg-surface hover:bg-surface-container-low p-sm flex items-center gap-md text-left group transition-colors">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary-container transition-colors">
<span aria-hidden="true" class="material-symbols-outlined">storefront</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-button text-button text-on-surface mb-1 group-hover:text-primary-container transition-colors">Vendor</p>
<p class="font-label-caps text-label-caps text-on-surface-variant truncate normal-case tracking-normal">Manage bookings</p>
</div>
<div class="flex-shrink-0 text-outline opacity-0 group-hover:opacity-100 transition-opacity">
<span aria-hidden="true" class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
<!-- Worker (Approved) -->
<button class="w-full min-h-[64px] rounded-xl border border-surface-variant bg-surface hover:bg-surface-container-low p-sm flex items-center gap-md text-left group transition-colors">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary-container transition-colors">
<span aria-hidden="true" class="material-symbols-outlined">engineering</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-button text-button text-on-surface mb-1 group-hover:text-primary-container transition-colors">Worker</p>
<p class="font-label-caps text-label-caps text-on-surface-variant truncate normal-case tracking-normal">Execute tasks</p>
</div>
<div class="flex-shrink-0 text-outline opacity-0 group-hover:opacity-100 transition-opacity">
<span aria-hidden="true" class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
</div>
<!-- Footer -->
<div class="p-md bg-surface-container-lowest border-t border-surface-variant flex flex-col gap-sm sticky bottom-0">
<p class="font-label-caps text-label-caps text-on-surface-variant text-center normal-case tracking-normal leading-relaxed">
                You use one Mee Events account. Available roles depend on current approval.
            </p>
<button class="w-full py-sm px-md rounded-lg font-button text-button text-primary-container hover:bg-primary-container/5 transition-colors border border-transparent hover:border-primary-container/20">
                Manage applications
            </button>
</div>
