<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Contact Preferences - Mee Events</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&amp;family=Manrope:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@100..900&amp;family=Manrope:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom scrollbar for chips */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#8c8c88",
                    "surface-container": "#f0eded",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#1b1c19",
                    "background": "#fcf9f8",
                    "surface-container-low": "#f6f3f2",
                    "surface-dim": "#dcd9d9",
                    "on-secondary": "#ffffff",
                    "tertiary": "#0f100d",
                    "inverse-on-surface": "#f3f0ef",
                    "on-primary-fixed-variant": "#77302d",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#dac1bf",
                    "on-primary-container": "#cc726d",
                    "on-error-container": "#93000a",
                    "on-surface": "#1c1b1b",
                    "outline": "#877270",
                    "on-error": "#ffffff",
                    "surface-container-high": "#eae7e7",
                    "on-secondary-container": "#785a1a",
                    "inverse-primary": "#ffb3ad",
                    "tertiary-fixed": "#e4e2dd",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#c8c6c2",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fcf9f8",
                    "secondary-container": "#fed488",
                    "secondary": "#775a19",
                    "primary": "#2a0002",
                    "on-surface-variant": "#544341",
                    "on-secondary-fixed-variant": "#5d4201",
                    "on-tertiary-fixed-variant": "#474744",
                    "primary-container": "#4a0e0e",
                    "tertiary-container": "#242522",
                    "inverse-surface": "#313030",
                    "primary-fixed": "#ffdad7",
                    "surface-container-highest": "#e5e2e1",
                    "on-background": "#1c1b1b",
                    "secondary-fixed-dim": "#e9c176",
                    "primary-fixed-dim": "#ffb3ad",
                    "surface-bright": "#fcf9f8",
                    "on-primary": "#ffffff",
                    "surface-variant": "#e5e2e1",
                    "on-secondary-fixed": "#261900",
                    "surface-tint": "#954742",
                    "on-primary-fixed": "#3d0506",
                    "secondary-fixed": "#ffdea5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "48px",
                    "md": "24px",
                    "gutter": "24px",
                    "container-max": "1280px",
                    "xs": "4px",
                    "xl": "80px",
                    "sm": "12px",
                    "base": "8px"
            },
            "fontFamily": {
                    "display-hero-mobile": ["EB Garamond"],
                    "h1": ["Manrope"],
                    "button": ["Manrope"],
                    "h2": ["Manrope"],
                    "display-hero": ["EB Garamond"],
                    "body-md": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "label-caps": ["Manrope"]
            },
            "fontSize": {
                    "display-hero-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "500" }],
                    "h1": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                    "button": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                    "h2": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                    "display-hero": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                    "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }]
            }
          }
        }
      }

</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Form Header (Replaces Nav Shell for focus) -->
<header class="w-full px-md h-16 flex items-center justify-between border-b border-surface-variant bg-surface sticky top-0 z-10 max-w-container-max mx-auto">
    <div class="flex items-center gap-md">
        <button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-button text-button hover:bg-surface-container transition-colors" type="button">
            PS
        </button>
    </div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
        <span class="font-display-hero text-h1 text-primary tracking-tight">Mee Events</span>
    </div>
    <div class="flex items-center gap-sm">
        <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-full transition-colors" type="button">
            <span class="material-symbols-outlined">search</span>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-full transition-colors" type="button">
            <span class="material-symbols-outlined">favorite</span>
        </button>
        <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-full transition-colors" type="button">
            <span class="material-symbols-outlined">notifications</span>
        </button>
    </div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-3xl mx-auto px-md py-lg md:py-xl flex flex-col gap-lg"><div class="flex items-center justify-between mb-md">
    <button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container" type="button">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <span class="font-label-caps text-label-caps text-on-surface-variant">Step 4 of 4</span>
    <button class="font-button text-button text-primary hover:text-primary-container transition-colors" type="button">
        Save and exit
    </button>
</div>
<!-- Header -->
<div class="text-center md:text-left flex flex-col gap-xs">
<h1 class="font-h1 text-h1 text-primary">How should we contact you?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose your preferred way to receive event updates and coordinate with our planning team.</p>
</div>
<!-- Contact Method -->
<section class="flex flex-col gap-md">
<h2 class="font-h2 text-h2 text-on-surface">Contact method</h2>
<div class="flex flex-wrap gap-base">
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all flex items-center gap-xs" type="button"><span class="material-symbols-outlined text-[18px]" data-icon="call">call</span>Phone call</button>
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="sms">sms</span>
                    SMS
                </button>
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="notifications">notifications</span>
                    In-app update
                </button>
</div>
</section>
<!-- Best Time -->
<section class="flex flex-col gap-md">
<h2 class="font-h2 text-h2 text-on-surface">Best time</h2>
<div class="flex flex-wrap gap-base">
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all" type="button">
                    Morning
                </button>
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all" type="button">Afternoon</button>
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-button text-button border border-outline-variant hover:border-outline hover:bg-surface-container-high transition-all" type="button">
                    Evening
                </button>
<button class="px-md py-sm rounded-full bg-surface text-primary font-button text-button border border-outline-variant hover:bg-surface-container hover:border-primary transition-all flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
                    Choose a time
                </button>
</div>
</section>
<!-- Your Details Summary Card -->
<section class="bg-surface rounded-[14px] p-md border border-outline-variant flex flex-col gap-sm shadow-[0px_2px_8px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between mb-xs">
<h3 class="font-label-caps text-label-caps text-on-surface-variant">Your Details</h3>
<button class="text-primary hover:text-primary-container font-button text-button transition-colors" type="button">Edit</button>
</div>
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-h2 text-h2">
                    PS
                </div>
<div class="flex flex-col">
<span class="font-h2 text-h2 text-on-surface" style="font-size: 18px;">Priya Sharma</span>
<div class="flex items-center gap-xs text-on-surface-variant font-body-md text-sm mt-1">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="verified">verified</span>
                        Verified number
                    </div>
</div>
</div>
<div class="h-[1px] w-full bg-surface-variant my-xs"></div>
<div class="flex flex-col gap-2">
<div class="flex items-center gap-sm text-on-surface-variant font-body-md">
<span class="material-symbols-outlined text-[18px]" data-icon="call">call</span>
<span class="">+91 98765 43210</span>
</div>
<div class="flex items-center gap-sm text-on-surface-variant font-body-md">
<span class="material-symbols-outlined text-[18px]" data-icon="mail">mail</span>
<span class="">priya.sharma@example.com</span>
</div>
</div>
</section>
<!-- Consent & Actions -->
<section class="mt-md flex flex-col gap-lg">
<label class="flex items-start gap-sm cursor-pointer group">
<div class="relative flex items-center mt-1">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border border-outline-variant bg-surface checked:border-primary checked:bg-primary transition-all" type="checkbox">
<span class="absolute text-on-primary opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant leading-relaxed">I consent to Mee Events contacting me about this enquiry using my selected contact method.<br><span class="mt-1 block">Your information will be handled according to the <a class="text-primary underline hover:text-primary-container transition-colors" href="#">Mee Events Privacy Policy</a>.</span></span>
</label>
<div class="flex flex-col gap-md pt-md border-t border-surface-variant">
<button class="w-full bg-primary text-on-primary py-4 px-md rounded-lg font-button text-button shadow-[0px_10px_30px_rgba(74,14,14,0.15)] hover:bg-primary-container hover:shadow-[0px_12px_35px_rgba(74,14,14,0.2)] transition-all active:scale-[0.98] opacity-0 pointer-events-none" type="button" disabled="true">
                    Review plan
                </button>
</div>
</section>
</main>




</body></html>
