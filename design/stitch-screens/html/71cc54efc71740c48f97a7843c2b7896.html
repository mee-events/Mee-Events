<span class="material-symbols-outlined text-[16px]">lock</span>

                    </p>
</div>

</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">

<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out" for="toggle1"></label>
</div>
</div>
<div class="w-full h-px bg-outline-variant/30"></div>

<input class="bg-transparent border-none outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" placeholder="Select date..." type="text"/>
</div>
</div>

<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Access Code</label>

<input class="bg-transparent border-none outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" placeholder="e.g. MEE2024" type="text"/>
</div>
</div>

<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out" for="toggle2"></label>
</div>
