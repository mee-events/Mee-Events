<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Edit Personal Details - Mee Events</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-background": "#1c1b1b",

                        "error": "#ba1a1a",

                        "on-primary-fixed-variant": "#77302d",
                        "inverse-surface": "#313030",
                        "tertiary-container": "#242522",

                    "fontFamily": {

                },
            },
        }

<style>
        body {
            background-color: #F9F7F2; /* Warm Ivory Canvas */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .premium-input {
            border: 1px solid #E5DED4;
            border-radius: 8px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .premium-input:focus {
            border-color: #2a0002;
            outline: none;
            box-shadow: 0 0 0 1px #2a0002;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md text-on-surface antialiased min-h-screen pb-safe">
<!-- Top Navigation (Task-focused, so no Bottom Nav or full Top App Bar) -->
<header class="w-full bg-background/95 backdrop-blur-sm sticky top-0 z-40 border-b border-surface-variant/30">
<div class="max-w-container-max mx-auto px-gutter py-sm flex items-center justify-between">
<button class="text-primary hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-primary font-bold absolute left-1/2 -translate-x-1/2">Personal Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="max-w-container-max mx-auto px-gutter py-lg md:py-xl">
<div class="max-w-2xl mx-auto space-y-lg">
<!-- Profile Image Section -->
<section class="flex flex-col items-center space-y-4">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full overflow-hidden border-2 border-outline-variant/30 relative bg-surface-container-high flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A portrait of a confident, elegant Indian woman in her late 20s, with a warm smile. She is wearing a modern, muted-burgundy designer top. The background is a soft, out-of-focus high-end interior reflecting the Warm Ivory and Deep Burgundy Mee Events color palette. Lighting is soft, natural, and flattering." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHJoqpnilmHnDnurW4Zqwl49vNjlpXLXyOfWnioQ_W5Xx_r2kq3nSUwERaviGguB-LGhHa0mq2lvlgmjgKulZd8vRp0l_vH63TWqSV-DzyaS2uap8SV7onyAJESjtJx0PQWYxvKWMKoAZuyrt-wIgGOPvtfqTNz2ICILIjSxaAZz1Qntu9-OsIygKH8vogAuTD83n2mzQasNdBLKzMw5K9x4uSa_DUeAkwRkUjSfGjZVk_c0eLo6J5">
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-full">
<span class="material-symbols-outlined text-white text-2xl">edit</span>
</div>
</div>
</div>
</section>
<!-- Form Details -->
<form class="space-y-md">
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name</label>
<input class="w-full premium-input px-md py-sm font-body-lg text-body-lg text-on-surface" id="fullName" placeholder="Enter your full name" type="text" value="Ananya Rao">
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center justify-between" for="email">
                        Email Address
                        <span class="text-secondary flex items-center gap-1 text-xs"><span class="material-symbols-outlined filled-icon text-[14px]">check_circle</span> Verified</span>
</label>
<input class="w-full premium-input px-md py-sm font-body-lg text-body-lg text-on-surface" id="email" placeholder="Enter your email" type="email" value="ananya.rao@example.com">
</div>
<!-- DOB -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full premium-input px-md py-sm font-body-lg text-body-lg text-on-surface-variant appearance-none bg-transparent" id="dob" type="date">
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</div>
</div>
</div>
<!-- City -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="city">Preferred City</label>
<div class="relative">
<select class="w-full premium-input px-md py-sm font-body-lg text-body-lg text-on-surface appearance-none" id="city">
<option selected="" value="Hyderabad">Hyderabad</option>
<option value="Delhi">Delhi</option>
<option value="Mumbai">Mumbai</option>
<option value="Bangalore">Bangalore</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Mobile (Read-only + Action) -->
<div class="pt-4 border-t border-outline-variant/30 space-y-4">
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center justify-between">
                            Verified Mobile Number
                            <span class="text-secondary flex items-center gap-1 text-xs"><span class="material-symbols-outlined filled-icon text-[14px]">check_circle</span> Verified</span>
</label>
<div class="w-full premium-input px-md py-sm font-body-lg text-body-lg text-on-surface-variant bg-surface-container-lowest cursor-not-allowed flex items-center gap-2">
<span class="font-bold">+91</span>
<span>•••••• 4821</span>
</div>
</div>
<button class="font-button text-button text-secondary hover:text-primary transition-colors flex items-center gap-2" type="button">
<span>Change mobile number</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
<!-- Save Action -->
<div class="pt-xl pb-md">
<button class="w-full py-4 rounded-lg font-button text-button text-on-primary bg-primary/50 cursor-not-allowed transition-all duration-300 shadow-sm flex items-center justify-center gap-2" disabled="" type="button">
                        Save changes
                    </button>
</div>
</form>
</div>
</main>
</body></html>
