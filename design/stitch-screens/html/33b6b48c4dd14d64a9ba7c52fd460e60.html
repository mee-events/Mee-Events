<style>

          .soft-border { border-color: #E5DED4; }

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation (Transactional Intent - Minimal) -->
<header class="bg-surface sticky top-0 z-40 border-b border-outline-variant/30 px-md py-4 flex justify-between items-center max-w-container-max mx-auto w-full">
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center cursor-pointer hover:shadow-md transition-all">
      <span class="material-symbols-outlined text-on-secondary-container">person</span>
    </div>
  </div>
  <div class="font-display-hero-mobile text-h2 text-primary font-medium tracking-tight absolute left-1/2 -translate-x-1/2">
    Mee Events
  </div>
  <div class="flex items-center gap-4">
    <button class="text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">search</span>
    </button>
    <button class="text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">favorite</span>
    </button>
    <button class="text-on-surface-variant hover:text-primary transition-colors relative">
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-0 right-0 w-2 h-2 bg-error rounded-full"></span>
    </button>
  </div>
</header>
<main class="flex-grow w-full max-w-[800px] mx-auto px-md py-lg md:py-xl flex flex-col gap-lg"><div class="flex justify-between items-center w-full">
  <button class="flex items-center gap-2 text-primary hover:text-primary-container transition-colors group">
    <span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
    <span class="font-label-caps text-label-caps tracking-wider">Back to Overview</span>
  </button>
  <button class="text-on-surface-variant hover:text-primary transition-colors font-button text-button">
    Save &amp; Exit
  </button>
</div>
<!-- Header Section -->
<section class="flex flex-col gap-4 text-center md:text-left">
<div class="flex items-center justify-center md:justify-start gap-3 text-secondary font-label-caps text-label-caps uppercase tracking-wider mb-2">
<span class="">Step 3 of 5</span>
<span class="w-1 h-1 rounded-full bg-secondary"></span>
<span class="">Event Details</span>
</div>
<h1 class="font-display-hero text-display-hero-mobile md:text-display-hero text-primary">Help us understand your preferences</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">
                Tell us about your vision for each function. The more details you share, the better we can tailor the vendor recommendations.
            </p>
</section>
<!-- Function Tabs -->
<nav class="w-full border-b soft-border flex overflow-x-auto scrollbar-hide">
<div class="flex gap-8 min-w-max px-2">
<button class="pb-4 border-b-2 border-primary text-primary font-button text-button transition-colors px-1">
                    Mehndi
                </button>
<button class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-colors px-1 font-button text-button">
                    Haldi
                </button>
<button class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-colors px-1 font-button text-button">
                    Sangeet
                </button>
<button class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-colors px-1 font-button text-button">
                    Wedding
                </button>
<button class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-colors px-1 font-button text-button">
                    Reception
                </button>
</div>
</nav>
<!-- Form Canvas (Bento-style layout for questions) -->
<div class="bg-surface rounded-xl p-md md:p-lg border soft-border shadow-[0px_10px_30px_rgba(74,14,14,0.02)] flex flex-col gap-lg">
<div class="flex justify-between items-center pb-4 border-b soft-border">
<h2 class="font-h2 text-h2 text-primary">Mehndi Preferences</h2>
<div class="bg-surface-container-lowest border soft-border px-3 py-1 rounded-full font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
                    0 / 5 Completed
                </div>
</div>
<!-- Q1: Preferred Style -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-start">
<label class="font-button text-button text-on-surface">What is your preferred decor style?</label>
<button class="text-on-surface-variant hover:text-primary font-label-caps text-label-caps underline underline-offset-4 decoration-outline-variant">Skip for now</button>
</div>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-2.5 rounded-full chip-active font-button text-button transition-colors">Vibrant &amp; Traditional</button>
<button class="px-5 py-2.5 rounded-full chip-inactive hover:border-primary transition-colors font-button text-button">Boho Chic</button>
<button class="px-5 py-2.5 rounded-full chip-inactive hover:border-primary transition-colors font-button text-button">Floral Canopy</button>
<button class="px-5 py-2.5 rounded-full chip-inactive hover:border-primary transition-colors font-button text-button">Minimalist Elegance</button>
<button class="px-5 py-2.5 rounded-full chip-inactive hover:border-primary transition-colors font-button text-button">Quirky &amp; Fun</button>
</div>
</div>
<!-- Q2: Color Palette -->
<div class="flex flex-col gap-4 pt-6 border-t soft-border">
<div class="flex justify-between items-start">
<label class="font-button text-button text-on-surface">Preferred color palette (Select up to 3)</label>
<button class="text-on-surface-variant hover:text-primary font-label-caps text-label-caps underline underline-offset-4 decoration-outline-variant">Skip for now</button>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<label class="relative flex items-center gap-3 p-3 rounded-lg border soft-border cursor-pointer hover:bg-surface-container-low transition-colors group">
<input checked="" class="peer sr-only" name="color_marigold" type="checkbox">
<div class="w-6 h-6 rounded-full bg-[#f9a826] border border-black/10 flex-shrink-0 relative">
<span class="material-symbols-outlined text-white absolute inset-0 m-auto text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary peer-checked:font-semibold">Marigold Yellow</span>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-lg border soft-border cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="color_fuchsia" type="checkbox">
<div class="w-6 h-6 rounded-full bg-[#c11f7c] border border-black/10 flex-shrink-0 relative">
<span class="material-symbols-outlined text-white absolute inset-0 m-auto text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary peer-checked:font-semibold">Fuchsia Pink</span>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-lg border soft-border cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="color_emerald" type="checkbox">
<div class="w-6 h-6 rounded-full bg-[#2a7a50] border border-black/10 flex-shrink-0 relative">
<span class="material-symbols-outlined text-white absolute inset-0 m-auto text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary peer-checked:font-semibold">Emerald Green</span>
</label>
<label class="relative flex items-center gap-3 p-3 rounded-lg border soft-border cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="color_pastel" type="checkbox">
<div class="w-6 h-6 rounded-full bg-gradient-to-br from-[#fbd3e9] to-[#bbd2c5] border border-black/10 flex-shrink-0 relative">
<span class="material-symbols-outlined text-black/60 absolute inset-0 m-auto text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary peer-checked:font-semibold">Pastel Hues</span>
</label>
</div>
</div>
<!-- Q3: Stage & Seating (Dropdowns) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md pt-6 border-t soft-border">
<div class="flex flex-col gap-4">
<div class="flex justify-between items-start">
<label class="font-button text-button text-on-surface" for="stage_type">Stage Setup</label>
</div>
<div class="relative">
<select class="w-full appearance-none bg-surface border soft-border rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="stage_type">
<option disabled="" selected="" value="">Select stage type</option>
<option value="swing">Traditional Swing (Jhoola)</option>
<option value="sofa">Low Seating Diwan/Sofa</option>
<option value="gazebo">Floral Gazebo</option>
<option value="none">No formal stage, casual seating</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex justify-between items-start">
<label class="font-button text-button text-on-surface" for="seating_style">Guest Seating Style</label>
</div>
<div class="relative">
<select class="w-full appearance-none bg-surface border soft-border rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="seating_style">
<option disabled="" selected="" value="">Select seating arrangement</option>
<option value="round_tables">Round Tables (Banquet style)</option>
<option value="lounge">Lounge Seating (Sofas &amp; Poufs)</option>
<option value="floor">Traditional Floor Seating (Gaddas)</option>
<option value="mixed">Mixed Seating</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Q4: Special Instructions -->
<div class="flex flex-col gap-4 pt-6 border-t soft-border">
<div class="flex justify-between items-start">
<label class="font-button text-button text-on-surface" for="special_notes">Specific Instructions or Notes</label>
<span class="font-label-caps text-label-caps text-on-surface-variant">(Optional)</span>
</div>
<textarea class="w-full bg-surface border soft-border rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y" id="special_notes" placeholder="Any specific elements you want included? (e.g., live bangle maker, specific photo booth props, catering preferences...)" rows="4"></textarea>
</div>
</div>
<!-- Action Footer -->
<div class="flex flex-col md:flex-row justify-between items-center gap-4 mt-6">
<button class="text-on-surface hover:text-primary font-button text-button px-6 py-3 border border-transparent hover:soft-border rounded-full transition-all order-2 md:order-1">
                Back to Haldi (Previous)
            </button>
<button class="w-full md:w-auto bg-primary text-on-primary px-8 py-3 rounded-full font-button text-button hover:bg-primary-container shadow-[0px_10px_30px_rgba(74,14,14,0.1)] hover:shadow-[0px_10px_40px_rgba(74,14,14,0.15)] transition-all flex items-center justify-center gap-2 order-1 md:order-2">
                Continue to Haldi
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
