<style>
        .bottom-sheet-enter {
            transform: translateY(100%);
        }
        .bottom-sheet-enter-active {
            transform: translateY(0);
            transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scrim-enter {
            opacity: 0;
        }
        .scrim-enter-active {
            opacity: 1;
            transition: opacity 300ms ease-out;
        }
    </style>

<body class="bg-surface font-body-md text-on-surface antialiased overflow-hidden">
<!-- Dimmed Background (Step 4 placeholder) -->
<div class="fixed inset-0 bg-surface-variant flex flex-col pt-16 px-md pointer-events-none filter blur-sm">
<!-- TopAppBar (Simplified for background context) -->
<header class="flex justify-between items-center w-full px-md h-16 max-w-container-max mx-auto border-b border-outline-variant bg-surface sticky top-0 left-0 right-0 z-10">
    <div class="flex items-center gap-md">
        <button class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
            <span class="material-symbols-outlined">account_circle</span>
        </button>
    </div>
    <div class="absolute left-1/2 -translate-x-1/2">
        <h1 class="font-h2 text-h2 text-primary font-bold tracking-tight">Mee Events</h1>
    </div>
    <div class="flex items-center gap-2">
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
            <span class="material-symbols-outlined">search</span>
        </button>
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
            <span class="material-symbols-outlined">favorite</span>
        </button>
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full border-2 border-surface"></span>
        </button>
    </div>
</header>
<main class="mt-lg max-w-container-max mx-auto w-full"><div class="flex items-center gap-4 mb-md">
    <button class="p-2 -ml-2 text-primary hover:bg-surface-container rounded-full transition-colors">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h2 class="font-h1 text-h1 text-primary">Add External Vendor</h2>
</div>

<div class="bg-surface rounded-xl border border-outline-variant p-md mb-md">
<div class="h-8 bg-surface-container rounded mb-sm w-1/3"></div>
<div class="h-4 bg-surface-container rounded mb-sm w-full"></div>
<div class="h-4 bg-surface-container rounded w-2/3"></div>
</div>
<div class="bg-surface rounded-xl border border-outline-variant p-md">
<div class="h-8 bg-surface-container rounded mb-sm w-1/4"></div>
<div class="h-4 bg-surface-container rounded mb-sm w-full"></div>
<div class="h-4 bg-surface-container rounded w-1/2"></div>
</div>
</main>
</div>
<!-- Scrim overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-tertiary/50 backdrop-blur-sm z-40 scrim-enter-active" id="scrim"></div>
<!-- Bottom Sheet -->
<div class="fixed inset-x-0 bottom-0 z-50 flex justify-center pb-safe-area pt-safe-area pointer-events-none" id="bottom-sheet-container">
<div class="w-full max-w-2xl bg-surface rounded-t-[24px] shadow-[0px_-10px_40px_rgba(74,14,14,0.08)] pointer-events-auto flex flex-col max-h-[795px] bottom-sheet-enter-active relative" id="bottom-sheet">
<!-- Drag Handle / Header -->
<div class="sticky top-0 bg-surface z-10 rounded-t-[24px] pt-sm pb-md px-md border-b border-outline-variant">
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto mb-4"></div>
<div class="flex justify-between items-start">
<div>
<h2 class="font-h2 text-h2 text-primary mb-1">Add a preferred external vendor</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                            This information remains private. Adding a preference does not register the vendor automatically.
                        </p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container-low" id="close-sheet">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="overflow-y-auto px-md py-md flex-1">
<form class="flex flex-col gap-md">
<!-- Vendor Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="vendor-name">Vendor name *</label>
<input class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="vendor-name" placeholder="Enter vendor name" type="text">
</div>
<!-- Service Type -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="service-type">Service type *</label>
<select class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary appearance-none transition-shadow" id="service-type">
<option disabled="" selected="" value="">Select service type</option>
<option value="catering">Catering</option>
<option value="photography">Photography</option>
<option value="decor">Decor &amp; Floral</option>
<option value="music">Music &amp; Entertainment</option>
<option value="other">Other</option>
</select>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Contact Person -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="contact-person">Contact person</label>
<input class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="contact-person" placeholder="Name of point of contact" type="text">
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="mobile">Mobile number</label>
<input class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="mobile" placeholder="+91" type="tel">
</div>
</div>
<!-- Locality -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="locality">Locality / City</label>
<input class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="locality" placeholder="e.g. Jubilee Hills, Hyderabad" type="text">
</div>
<!-- Website/Social -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="website">Website or Social Link</label>
<input class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="website" placeholder="https:// or @handle" type="url">
</div>
<!-- Preferred Reason -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="reason">Preferred reason</label>
<textarea class="w-full bg-surface border border-[#E5DED4] rounded-lg px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary resize-none transition-shadow" id="reason" placeholder="Why do you prefer this vendor?" rows="3"></textarea>
</div>
<!-- Supporting Attachment -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Supporting attachment</label>
<div class="border-2 border-dashed border-[#E5DED4] rounded-lg p-6 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors mb-2" data-icon="upload_file">upload_file</span>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Click to upload or drag and drop</span>
<span class="font-body-md text-xs text-outline mt-1">PDF, JPG, PNG (Max 5MB)</span>
<input class="hidden" id="file-upload" type="file">
</div>
</div>
<!-- Permission Checkbox -->
<div class="flex items-start gap-3 mt-2 mb-4">
<div class="flex items-center h-5 mt-0.5">
<input class="w-5 h-5 border-[#E5DED4] rounded text-primary focus:ring-primary bg-surface cursor-pointer" id="permission" type="checkbox">
</div>
<label class="font-body-md text-sm text-on-surface-variant cursor-pointer select-none" for="permission">
                            I give Mee Events permission to contact this vendor on my behalf regarding this event if required.
                        </label>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="sticky bottom-0 bg-surface border-t border-outline-variant p-md flex flex-col sm:flex-row gap-4 justify-end rounded-b-[24px]">
<button class="order-2 sm:order-1 px-6 py-3 font-button text-button text-primary bg-transparent border border-primary rounded hover:bg-surface-container-low transition-colors w-full sm:w-auto" id="cancel-btn" type="button">
                    Cancel
                </button>
<button class="order-1 sm:order-2 px-6 py-3 font-button text-button text-on-primary bg-primary-container rounded hover:bg-primary transition-colors w-full sm:w-auto shadow-[0px_10px_30px_rgba(74,14,14,0.05)] hover:shadow-[0px_15px_40px_rgba(74,14,14,0.1)]" type="button">
                    Add preference
                </button>
</div>
</div>
</div>
<script>
        // Simple animation script for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('close-sheet');
            const cancelBtn = document.getElementById('cancel-btn');
            const sheet = document.getElementById('bottom-sheet');
            const scrim = document.getElementById('scrim');
            
            function closeSheet() {
                sheet.classList.remove('bottom-sheet-enter-active');
                sheet.classList.add('bottom-sheet-enter');
                scrim.classList.remove('scrim-enter-active');
                scrim.classList.add('scrim-enter');
                
                // Reset after animation
                setTimeout(() => {
                    // In a real app, this would remove the element from DOM or route back
                    sheet.classList.remove('bottom-sheet-enter');
                    sheet.classList.add('bottom-sheet-enter-active');
                    scrim.classList.remove('scrim-enter');
                    scrim.classList.add('scrim-enter-active');
                }, 400);
            }

            closeBtn.addEventListener('click', closeSheet);
            cancelBtn.addEventListener('click', closeSheet);
            scrim.addEventListener('click', closeSheet);
        });
    </script>


</body></html>
