<body class="text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Mobile/Desktop) -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant flat no shadows flex justify-between items-center w-full px-md h-16 max-w-container-max mx-auto hidden md:flex">
<div class="flex items-center">
<span class="material-symbols-outlined mr-sm cursor-pointer hover:text-secondary transition-colors duration-200" data-icon="menu">menu</span>
<span class="text-h1 font-display-hero text-primary tracking-tight">Mee Events</span>
</div>
<div class="flex items-center text-primary">
<span class="font-button cursor-pointer hover:text-secondary transition-colors duration-200">Customer ▾</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-md md:p-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-surface-variant p-md md:p-lg shadow-[0px_10px_30px_rgba(74,14,14,0.05)] text-center">
<span class="material-symbols-outlined text-[48px] text-error mb-md" data-icon="warning">warning</span>
<h1 class="text-h1 font-h1-mobile md:font-h1 text-on-surface mb-sm">Verify Deletion</h1>
<p class="text-body-md font-body-md text-on-surface-variant mb-lg">
                To confirm the deletion of your account, please enter the 6-digit code sent to your registered mobile number ending in <strong>****1234</strong>.
            </p>
<form class="flex flex-col items-center" id="otpForm">
<!-- OTP Input Group -->
<div class="flex gap-xs sm:gap-sm justify-center mb-md w-full">
<input aria-label="Digit 1" autocomplete="one-time-code" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 text-center text-h2 font-h2 border border-surface-variant rounded-lg bg-surface-container-lowest focus:ring-0 transition-colors" inputmode="numeric" maxlength="1" type="text"/>
</div>
<!-- Error Message (Hidden by default) -->
<div class="text-error text-body-md font-body-md mb-md hidden flex items-center gap-xs" id="errorMessage">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
                     Incorrect code. Please try again.
                </div>
<!-- Resend Timer -->
<div class="text-body-md font-body-md text-on-surface-variant mb-lg flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="timer">timer</span>
                    Resend code in <span class="font-bold text-primary" id="timer">00:59</span>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full bg-primary text-on-primary py-sm px-md rounded-full text-button font-button hover:bg-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="verifyBtn" type="button">
                        Verify &amp; Delete
                    </button>
<button class="w-full bg-transparent text-primary py-sm px-md rounded-full text-button font-button border border-primary hover:bg-surface-variant transition-colors" id="cancelBtn" type="button">
                        Cancel
                    </button>
</div>

</main>
<!-- Bottom Nav Bar (Mobile Only) - Suppressed for this transactional flow as per semantic shell mandate -->
<!-- Not rendering bottom nav to prioritize the focused deletion journey -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verifyBtn');
            const errorMessage = document.getElementById('errorMessage');
            const timerDisplay = document.getElementById('timer');
            
            // Auto-focus and move to next input
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    validateInputs();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            function validateInputs() {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                // Simple validation mock
                if (allFilled) {
                   // Mock error state for demonstration
                   if(inputs[0].value === '0') {
                        inputs.forEach(input => input.classList.add('error'));
                        errorMessage.classList.remove('hidden');
                   } else {
                        inputs.forEach(input => input.classList.remove('error'));
                        errorMessage.classList.add('hidden');
                   }
                } else {
                    inputs.forEach(input => input.classList.remove('error'));
                    errorMessage.classList.add('hidden');
                }
            }

            // Simple Timer Mock
            let timeLeft = 59;
            const timerId = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timerId);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.parentElement.innerHTML = `<button type="button" class="text-secondary font-button font-bold hover:underline cursor-pointer">Resend Code</button>`;
                } else {
                    timerDisplay.textContent = `00:${timeLeft.toString().padStart(2, '0')}`;
                }
            }, 1000);
            
            // Cancel Action
            document.getElementById('cancelBtn').addEventListener('click', () => {
                // Navigate back or dismiss
                console.log('Action cancelled');
            });
        });
    </script>
