        body {
            background-color: theme('colors.warm-ivory');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col relative pb-safe">
<!-- Top Navigation (Task-focused, suppressed main nav) -->
<header class="bg-surface-container-lowest border-b border-soft-border/50 sticky top-0 z-40">
<div class="max-w-container-max mx-auto w-full px-gutter py-sm flex justify-between items-center h-16">
<div class="flex items-center gap-xs">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-h2 text-h2 text-on-surface">Saved Addresses</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-gutter py-lg md:py-xl flex flex-col gap-lg">
<!-- Info Banner -->
<div class="bg-secondary/10 border border-secondary/20 rounded-xl p-md flex gap-md items-start">
<span class="material-symbols-outlined text-secondary mt-xs" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    If an address is attached to an active event, please update it directly within the Event Workspace to ensure all logistics remain synchronized.
                </p>
</div>
</div>
<!-- Addresses List -->
<div class="flex flex-col gap-md">
<!-- Address Card 1 (Default) -->
<div class="bg-surface-container-lowest border border-soft-border rounded-2xl p-md md:p-lg flex flex-col sm:flex-row justify-between gap-md hover:shadow-interactive transition-shadow group relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex flex-col gap-sm pl-xs">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">home</span>
<h2 class="font-h2 text-h2 text-on-surface">Home</h2>
<span class="bg-secondary text-on-secondary font-label-caps text-label-caps px-2 py-1 rounded-full uppercase tracking-widest text-[10px]">Default</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md leading-relaxed">
                        Banjara Hills, Hyderabad,<br>
                        Telangana 500034
                    </p>
</div>
<div class="flex sm:flex-col gap-sm items-start sm:items-end justify-start sm:justify-center border-t sm:border-t-0 border-soft-border pt-4 sm:pt-0 mt-2 sm:mt-0">
<button class="flex items-center gap-xs font-button text-button text-primary hover:text-primary-container transition-colors py-2 px-3 rounded-lg hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[18px]">edit</span>
                        Edit
                    </button>
</div>
</div>
<!-- Address Card 2 -->
<div class="bg-surface-container-lowest border border-soft-border rounded-2xl p-md md:p-lg flex flex-col sm:flex-row justify-between gap-md hover:shadow-interactive transition-shadow group">
<div class="flex flex-col gap-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">apartment</span>
<h2 class="font-h2 text-h2 text-on-surface">Family Home</h2>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md leading-relaxed">
                        Jubilee Hills, Hyderabad,<br>
                        Telangana 500033
                    </p>
</div>
<div class="flex flex-wrap sm:flex-col gap-2 sm:gap-sm items-start sm:items-end justify-start sm:justify-center border-t sm:border-t-0 border-soft-border pt-4 sm:pt-0 mt-2 sm:mt-0">
<button class="flex items-center gap-xs font-button text-button text-on-surface-variant hover:text-primary transition-colors py-2 px-3 rounded-lg hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[18px]">star</span>
                        Set default
                    </button>
<button class="flex items-center gap-xs font-button text-button text-primary hover:text-primary-container transition-colors py-2 px-3 rounded-lg hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[18px]">edit</span>
                        Edit
                    </button>
<button class="flex items-center gap-xs font-button text-button text-error hover:text-error-container transition-colors py-2 px-3 rounded-lg hover:bg-error/10">
<span class="material-symbols-outlined text-[18px]">delete</span>
                        Remove
                    </button>
</div>
</div>
</div>
<!-- Add New Action -->
<div class="mt-md flex justify-center sm:justify-start">
<button class="bg-primary text-on-primary font-button text-button px-xl py-4 rounded-full hover:bg-primary-container transition-colors shadow-interactive flex items-center gap-sm">
<span class="material-symbols-outlined">add</span>
                Add new address
            </button>
</div>
</main>
