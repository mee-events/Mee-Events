<body class="font-body-md text-on-surface antialiased pb-32 md:pb-0">
<!-- Top Navigation (Transactional) -->
<header class="w-full h-16 flex justify-between items-center px-md max-w-container-max mx-auto border-b border-outline-variant/30 bg-surface">
  <div class="flex items-center gap-md">
    <button class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container hover:opacity-90 transition-opacity">
      <span class="material-symbols-outlined">person</span>
    </button>
  </div>
  <div class="flex items-center">
    <span class="font-display-hero-mobile text-2xl text-primary tracking-tight">Mee Events</span>
  </div>
  <div class="flex items-center gap-2">
    <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
      <span class="material-symbols-outlined">search</span>
    </button>
    <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
      <span class="material-symbols-outlined">favorite</span>
    </button>
    <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
      <span class="material-symbols-outlined">notifications</span>
    </button>
  </div>
</header>
<main class="max-w-3xl mx-auto px-md py-lg md:py-xl"><div class="flex justify-between items-center mb-md">
  <button aria-label="Back" class="text-primary p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors flex items-center gap-2">
    <span class="material-symbols-outlined">arrow_back</span>
    <span class="font-button text-button">Back</span>
  </button>
  <span class="font-label-caps text-label-caps text-on-surface-variant">1 of 4 — Event</span>
</div>
<h1 class="font-display-hero-mobile text-display-hero-mobile md:font-display-hero md:text-display-hero text-primary mb-xl text-center">Tell us about your celebration</h1>
<!-- Form Section -->
<section class="space-y-xl">
<!-- Event Name -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider" for="event_name">Event Name</label>
<input class="input-surface w-full h-[56px] px-md rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-shadow" id="event_name" type="text" value="Priya &amp; Arjun’s Wedding">
</div>
<!-- Event Type -->
<div class="space-y-md">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Event Type</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<button class="card-surface interactive-shadow rounded-xl py-md px-sm text-center border-primary bg-primary-fixed-dim/20 transition-all">
<span class="material-symbols-outlined text-primary mb-2">favorite</span>
<span class="block font-button text-button text-primary">Wedding</span>
</button>
<button class="card-surface interactive-shadow rounded-xl py-md px-sm text-center hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant mb-2">cake</span>
<span class="block font-button text-button text-on-surface-variant">Birthday</span>
</button>
<button class="card-surface interactive-shadow rounded-xl py-md px-sm text-center hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant mb-2">ring_volume</span>
<span class="block font-button text-button text-on-surface-variant">Engagement</span>
</button>
<button class="card-surface interactive-shadow rounded-xl py-md px-sm text-center hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant mb-2">celebration</span>
<span class="block font-button text-button text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Functions (Multi-select) -->
<div class="space-y-md">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider">Functions</label>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Functions can have different dates and venues.</span>
</div>
<div class="flex flex-wrap gap-sm">
<!-- Selected Chips -->
<button class="bg-secondary-container text-on-secondary-container font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                        Mehndi
                    </button>
<button class="bg-secondary-container text-on-secondary-container font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                        Haldi
                    </button>
<button class="bg-secondary-container text-on-secondary-container font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                        Sangeet
                    </button>
<button class="bg-secondary-container text-on-secondary-container font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                        Wedding
                    </button>
<button class="bg-secondary-container text-on-secondary-container font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                        Reception
                    </button>
<!-- Unselected Chip -->
<button class="card-surface text-on-surface-variant font-button text-button px-6 py-3 rounded-full flex items-center gap-2 hover:bg-surface-container transition-colors interactive-shadow">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                        Engagement
                    </button>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-sm border-t border-outline-variant/30 p-md z-50">
<div class="max-w-3xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 16px;">cloud_done</span>
<span class="font-body-md text-body-md text-sm">Auto-saved</span>
</div>
<button class="bg-primary-container text-on-primary-container font-button text-button px-xl py-4 rounded-full hover:bg-primary hover:text-on-primary transition-colors interactive-shadow flex items-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
