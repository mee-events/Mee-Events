<!DOCTYPE html><html class="light" lang="en"><head>

<style>
        body { font-family: 'Manrope', sans-serif; background-color: #F9F7F2; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e2e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #dac1bf; }

        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #2a0002;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e2e1;
            border-radius: 2px;
        }
        
        .bottom-sheet-anim {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased overflow-hidden min-h-screen relative">
<!-- Background Mockup (Search Results) -->
<div class="fixed inset-0 z-0 opacity-40 blur-sm pointer-events-none">
<div class="p-gutter h-full overflow-hidden">
<div class="w-full h-48 bg-surface-container-high rounded-2xl mb-md"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-64 bg-surface-container-highest rounded-2xl"></div>
<div class="h-64 bg-surface-container-highest rounded-2xl"></div>
<div class="h-64 bg-surface-container-highest rounded-2xl"></div>
<div class="h-64 bg-surface-container-highest rounded-2xl"></div>
</div>
</div>
</div>
<!-- Scrim / Overlay -->
<div class="fixed inset-0 bg-tertiary/40 z-40 backdrop-blur-[2px] transition-opacity" id="scrim"></div>
<!-- Bottom Sheet -->
<div class="fixed inset-x-0 bottom-0 z-50 h-[751px] md:h-[663px] bg-on-primary rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] flex flex-col bottom-sheet-anim max-w-container-max mx-auto border-t border-outline-variant" id="bottomSheet">
<!-- Drag Handle & Header -->
<div class="flex-shrink-0 pt-4 pb-2 px-gutter sticky top-0 bg-on-primary rounded-t-3xl z-10 border-b border-outline-variant">
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-4 cursor-grab"></div>
<div class="flex justify-between items-center mb-2">
<h2 class="font-h2 text-h2 text-primary">Filters and sort</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-gutter py-md space-y-xl pb-32">
<!-- Sort Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-md tracking-wider">SORT BY</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-5 py-3 rounded-full border border-primary text-primary bg-primary-fixed-dim/20 font-button text-button flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">check</span> Recommended
                    </button>
<button class="px-5 py-3 rounded-full border border-outline-variant text-on-surface hover:border-outline transition-colors font-button text-button bg-surface">
                        Price (Low-High)
                    </button>
<button class="px-5 py-3 rounded-full border border-outline-variant text-on-surface hover:border-outline transition-colors font-button text-button bg-surface">
                        Price (High-Low)
                    </button>
<button class="px-5 py-3 rounded-full border border-outline-variant text-on-surface hover:border-outline transition-colors font-button text-button bg-surface">
                        Highest Rated
                    </button>
</div>
</section>
<hr class="border-outline-variant">
<!-- Category Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-md tracking-wider">EVENT/OCCASION</h3>
<div class="grid grid-cols-2 md:grid-cols-3 gap-sm">
<label class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md">Wedding</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md">Corporate</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md">Birthday</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md">Anniversary</span>
</label>
</div>
</section>
<!-- Offering Type -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-md tracking-wider">OFFERING TYPE</h3>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 border-outline text-primary focus:ring-primary" name="offering" type="radio">
<span class="font-body-md text-body-md">Service</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 border-outline text-primary focus:ring-primary" name="offering" type="radio">
<span class="font-body-md text-body-md">Rental</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 border-outline text-primary focus:ring-primary" name="offering" type="radio">
<span class="font-body-md text-body-md">Sale</span>
</label>
</div>
</section>
<!-- Price Range -->
<section>
<div class="flex justify-between items-end mb-md">
<h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-wider">PRICE RANGE (₹)</h3>
<span class="font-body-md text-body-md text-primary font-bold">₹5k - ₹50k+</span>
</div>
<div class="px-2">
<input class="w-full" max="100" min="0" type="range" value="50">
<div class="flex justify-between mt-2 text-on-surface-variant font-label-caps text-[10px]">
<span>Min</span>
<span>Max</span>
</div>
</div>
</section>
<!-- Rating -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-md tracking-wider">RATING</h3>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-5 h-5 border-outline text-primary focus:ring-primary" name="rating" type="radio">
<div class="flex items-center gap-1 text-secondary">
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="font-body-md text-body-md text-on-surface ml-2">5.0</span>
</div>
</label>
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-5 h-5 border-outline text-primary focus:ring-primary" name="rating" type="radio">
<div class="flex items-center gap-1 text-secondary">
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined fill text-[20px]">star</span>
<span class="material-symbols-outlined text-[20px]">star</span>
<span class="font-body-md text-body-md text-on-surface ml-2">4.0+</span>
</div>
</label>
</div>
</section>
</div>
<!-- Sticky Bottom Actions -->
<div class="absolute bottom-0 inset-x-0 p-gutter bg-on-primary border-t border-outline-variant flex gap-4 items-center rounded-t-xl z-20">
<button class="flex-1 py-4 px-6 border border-primary text-primary font-button text-button rounded-lg hover:bg-surface-container-low transition-colors text-center">
                Clear all
            </button>
<button class="flex-[2] py-4 px-6 bg-primary-container text-on-primary font-button text-button rounded-lg hover:bg-primary transition-colors text-center shadow-interactive">
                Show 24 results
            </button>
</div>
</div>
</body></html>
