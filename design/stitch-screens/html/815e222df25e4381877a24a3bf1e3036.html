<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Approve Quotation: Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=EB+Garamond:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1c1b1b",
                        "outline": "#877270",
                        "primary": "#2a0002",
                        "background": "#fcf9f8",
                        "surface-bright": "#fcf9f8",
                        "tertiary-fixed": "#e4e2dd",
                        "on-secondary-container": "#785a1a",
                        "on-primary-container": "#cc726d",
                        "surface-container": "#f0eded",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#261900",
                        "on-secondary-fixed-variant": "#5d4201",
                        "secondary-container": "#fed488",
                        "on-primary-fixed-variant": "#77302d",
                        "inverse-surface": "#313030",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "secondary-fixed": "#ffdea5",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#eae7e7",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#775a19",
                        "tertiary": "#0f100d",
                        "primary-fixed": "#ffdad7",
                        "on-surface-variant": "#544341",
                        "on-tertiary-container": "#8c8c88",
                        "surface-container-low": "#f6f3f2",
                        "primary-container": "#4a0e0e",
                        "outline-variant": "#dac1bf",
                        "tertiary-container": "#242522",
                        "on-tertiary-fixed-variant": "#474744",
                        "on-tertiary-fixed": "#1b1c19",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#ffb3ad",
                        "surface": "#fcf9f8",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed-dim": "#ffb3ad",
                        "on-primary": "#ffffff",
                        "surface-tint": "#954742",
                        "on-surface": "#1c1b1b",
                        "secondary-fixed-dim": "#e9c176",
                        "on-primary-fixed": "#3d0506",
                        "tertiary-fixed-dim": "#c8c6c2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "48px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "sm": "12px",
                        "xs": "4px",
                        "xl": "80px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "h1": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "display-hero-mobile": ["EB Garamond"],
                        "button": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "display-hero": ["EB Garamond"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-hero-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "button": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-hero": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased overflow-hidden">
<!-- Scrim / Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/40 z-40 transition-opacity"></div>
<!-- Bottom Sheet Container -->
<div class="fixed inset-x-0 bottom-0 z-50 transform transition-transform duration-300 ease-out flex justify-center w-full">
<div class="bg-surface-container-lowest w-full max-w-lg rounded-t-[24px] shadow-[0px_-10px_40px_rgba(42,0,2,0.1)] flex flex-col max-h-[795px]">
<!-- Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<div class="flex-1 overflow-y-auto px-gutter pb-gutter">
<!-- Header -->
<div class="flex justify-between items-start mb-6">
<div>
<h2 class="font-h2 text-h2 text-primary mb-1">Approve Quotation</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Version 2</p>
</div>
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Summary Card -->
<div class="bg-surface rounded-[14px] border border-[#E5DED4] p-md mb-6 relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container/20 rounded-bl-full -mr-16 -mt-16 z-0"></div>
<div class="relative z-10 space-y-4">
<div class="flex justify-between items-baseline border-b border-[#E5DED4] pb-4">
<span class="font-body-md text-body-md text-on-surface-variant">Total approved</span>
<span class="font-h2 text-h2 text-primary">₹11,80,000</span>
</div>
<div class="flex justify-between items-center pt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Advance required</span>
<span class="font-body-md text-body-md font-semibold text-on-background">₹3,54,000</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Valid-through</span>
<span class="font-body-md text-body-md font-semibold text-on-background">17 Aug 2026</span>
</div>
</div>
</div>
<!-- Information Message -->
<div class="flex gap-4 p-4 bg-surface-container-low rounded-lg mb-6 border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary shrink-0" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                        Approving this quotation initiates the booking process. Your booking is confirmed once the advance payment is verified.
                    </p>
</div>
<!-- Consent Checkbox -->
<label class="flex items-start gap-4 p-4 rounded-lg hover:bg-surface-container-lowest transition-colors cursor-pointer border border-transparent hover:border-[#E5DED4] group">
<div class="relative flex items-center mt-1">
<input class="peer h-5 w-5 appearance-none rounded-[4px] border-2 border-outline checked:border-primary checked:bg-primary transition-all cursor-pointer focus:ring-2 focus:ring-primary/20 focus:outline-none" id="consent-checkbox" type="checkbox">
<span class="material-symbols-outlined text-on-primary absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
<span class="font-body-md text-body-md text-on-background select-none leading-snug group-hover:text-primary transition-colors">
                        I have reviewed the quotation, inclusions, exclusions, payment schedule and cancellation terms.
                    </span>
</label>
</div>
<!-- Sticky Actions Footer -->
<div class="p-gutter border-t border-[#E5DED4] bg-surface-container-lowest pb-safe">
<div class="flex flex-col sm:flex-row-reverse gap-4">
<button class="flex-1 font-button text-button bg-primary text-on-primary py-4 px-6 rounded-full disabled:opacity-50 disabled:cursor-not-allowed hover:bg-primary-container transition-all hover:shadow-[0px_10px_30px_rgba(74,14,14,0.15)] flex justify-center items-center gap-2" disabled="" id="approve-btn">
<span>Approve ₹11,80,000</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="flex-1 font-button text-button bg-transparent text-primary py-4 px-6 rounded-full border border-primary hover:bg-surface-container-low transition-colors flex justify-center items-center">
                        Go back
                    </button>
</div>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('consent-checkbox');
            const approveBtn = document.getElementById('approve-btn');

            checkbox.addEventListener('change', (e) => {
                if(e.target.checked) {
                    approveBtn.removeAttribute('disabled');
                    approveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    approveBtn.setAttribute('disabled', 'true');
                    approveBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body></html>
