<body class="min-h-screen flex flex-col items-center justify-between font-body-md text-on-surface antialiased overflow-hidden selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Top Navigation (Back Button) -->
<header class="w-full max-w-md px-md py-md flex items-center justify-start absolute top-0 left-0 right-0 mx-auto z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors duration-200 text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-md px-md pt-xl pb-lg flex flex-col flex-1 justify-center z-0 mt-lg">
<!-- Branding & Header -->
<div class="text-center mb-lg fade-in-up">
<h1 class="font-display-hero-mobile text-display-hero-mobile text-primary mb-sm">
                Mee Events
            </h1>
<h2 class="font-h2 text-h2 text-on-surface mb-xs">
                Welcome to Mee Events
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter your mobile number to continue
            </p>
</div>
<!-- Form Area -->
<form class="flex flex-col space-y-md fade-in-up delay-100" id="loginForm" onsubmit="event.preventDefault();">
<!-- Mobile Number Input -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs uppercase tracking-wider" for="mobile_number">
                    Mobile Number
                </label>
<div class="flex items-center bg-surface border border-[#E5DED4] rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 overflow-hidden">
<div class="flex items-center justify-center px-sm py-sm bg-surface-container-low border-r border-[#E5DED4]">
<span class="font-body-md text-body-md text-on-surface font-semibold">+91</span>
</div>
<input class="flex-1 bg-transparent border-none focus:ring-0 px-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant w-full" id="mobile_number" inputmode="numeric" maxlength="10" name="mobile_number" pattern="[0-9]*" placeholder="00000 00000" required="" type="tel">
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-md bg-primary-container text-on-primary rounded-full font-button text-button hover:bg-primary transition-colors duration-300 shadow-[0px_10px_30px_rgba(74,14,14,0.05)] flex justify-center items-center group/btn mt-md" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined ml-xs opacity-0 -translate-x-2 group-hover/btn:opacity-100 group-hover/btn:translate-x-0 transition-all duration-300" style="font-size: 18px;">arrow_forward</span>
</button>
<div class="text-center mt-sm">
<a class="font-button text-button text-surface-tint hover:text-primary transition-colors duration-200 underline decoration-1 underline-offset-4" href="#">
                    Having trouble?
                </a>
</div>
</form>
</main>
<!-- Footer Terms -->
<footer class="w-full max-w-md px-md pb-md text-center fade-in-up delay-200">
<p class="font-body-md text-[13px] text-on-surface-variant leading-relaxed">
            By continuing, you agree to our 
            <a class="text-on-surface underline decoration-1 underline-offset-2 hover:text-primary transition-colors" href="#">Terms of Service</a> 
            and 
            <a class="text-on-surface underline decoration-1 underline-offset-2 hover:text-primary transition-colors" href="#">Privacy Policy</a>.
        </p>
</footer>
<style>
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-100 {
            animation-delay: 0.1s;
        }
        
        .delay-200 {
            animation-delay: 0.2s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<script>
        // Simple visual feedback for input
        const inputField = document.getElementById('mobile_number');
        inputField.addEventListener('input', function(e) {
            // Allow only numbers
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
