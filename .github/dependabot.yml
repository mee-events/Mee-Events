version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /apps/mobile
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:29"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:41"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
